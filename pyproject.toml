[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codebook-annotator"
version = "0.1.0"
description = "Annotate text with LLMs from a YAML codebook, with full run provenance and evaluation against human annotators."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Lavinia Marin" }, { name = "Valantis Andreas" }]
dependencies = [
    "httpx>=0.27,<1",
    "simplejson>=4.1",
    "PyYAML>=6.0",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
eval = ["numpy>=1.26", "pandas>=2.0", "openpyxl>=3.1"]
dev = ["numpy>=1.26", "pandas>=2.0", "openpyxl>=3.1", "pytest>=8", "ruff>=0.6", "mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]

[project.scripts]
cba = "codebook_annotator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codebook_annotator = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
